# nginx in front of the AutoCargo server (gunicorn on 127.0.0.1:8000).
#
# Port 80:  only POST /receive for the ESP32 nodes (they speak plain HTTP).
#           Everything else is redirected to HTTPS.
# Port 443: the dashboard, encrypted.
#
# Self-signed certificate for a LAN-only setup:
#   sudo openssl req -x509 -newkey rsa:2048 -nodes -days 825 \
#     -keyout /etc/ssl/private/autocargo.key -out /etc/ssl/certs/autocargo.crt \
#     -subj "/CN=autocargo.local"

server {
    listen 80;
    server_name _;
    client_max_body_size 4k;

    location = /receive {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;
    client_max_body_size 4k;

    ssl_certificate     /etc/ssl/certs/autocargo.crt;
    ssl_certificate_key /etc/ssl/private/autocargo.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
